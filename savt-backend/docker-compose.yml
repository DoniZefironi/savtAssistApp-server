services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  api:
    # network: host — у сборщика BuildKit своё, изолированное от хоста сетевое
    # пространство; когда там ломается DNS-форвардинг, apt-get/pip внутри сборки
    # не резолвят вообще ничего (deb.debian.org, pypi.org), хотя из обычных
    # контейнеров (docker run) и с самого хоста интернет доступен нормально —
    # см. инцидент 2026-08-27. network: host пускает сборку через сеть хоста
    # напрямую, в обход изолированной сети билдера.
    build:
      context: .
      network: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./uploads:/code/uploads
      - ./firebase-credentials.json:/code/firebase-credentials.json:ro
      - project_folders:/mnt/projects
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Слушает MQTT-брокеры контроллеров ШУ (у каждого ШУ свой брокер — host/port
  # берутся не отсюда, а из GET /webhooks/telemetry/targets, см. README) и
  # пересылает сообщения на api обычным HTTP (POST /webhooks/telemetry) — по
  # внутренней docker-сети, без nginx и без выхода наружу. Секрет вебхука общий
  # с api — то же значение из .env.
  telemetry-proxy:
    build:
      context: ./telemetry-proxy
      network: host
    restart: unless-stopped
    environment:
      Webhook__BaseUrl: http://api:8000
      Webhook__Secret: ${TELEMETRY_WEBHOOK_SECRET}
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Фронтенд деплоится отдельно (не в этом compose) и публикует свой порт 3000
    # на хост — из контейнера nginx он доступен только через хост, по docker-DNS
    # имя savt-assist-frontend не резолвится. См. proxy_pass в блоке listen 8080.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      # Секрет подписи /static/-ссылок (nginx secure_link). Тот же самый, что
      # у api — они ОБЯЗАНЫ совпадать, иначе nginx отдаст 403 на все файлы.
      # Берётся из .env, поэтому источник значения один на оба сервиса.
      STATIC_LINK_SECRET: ${STATIC_LINK_SECRET}
      # Штатный шаблонизатор nginx-образа подставляет переменные окружения в
      # *.template и кладёт результат сюда. Подставляется только то, что реально
      # есть в окружении контейнера, — $host/$uri/$secure_link не трогаются.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      # NGINX_CONF задаётся в .env: по умолчанию боевой nginx.conf (HTTPS + редирект),
      # nginx.http-fallback.conf — пока порт 443 снаружи не проброшен.
      # Монтируется как шаблон (см. NGINX_ENVSUBST_OUTPUT_DIR выше) — из него
      # получается /etc/nginx/nginx.conf уже с подставленным секретом.
      - ./${NGINX_CONF:-nginx.conf}:/etc/nginx/templates/nginx.conf.template:ro
      - ./uploads:/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# Сетевая шара NAS с папками проектов (см. app/services/project_folder_service.py).
# Учётные данные — из .env, не хранятся здесь. Если NAS_SHARE_DEVICE пуст/недоступен,
# монтирование при старте упадёт — тогда временно уберите том и PROJECT_FOLDERS_ROOT из .env.
volumes:
  project_folders:
    driver_opts:
      type: cifs
      device: "${NAS_SHARE_DEVICE}"
      o: "username=${NAS_SHARE_USER},password=${NAS_SHARE_PASSWORD},vers=3.0,uid=1000,gid=1000,iocharset=utf8"
